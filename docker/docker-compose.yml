name: open-manipulator-rmins

services:
  open_manipulator:
    container_name: open_manipulator
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: robotis/open-manipulator:latest
    init: true
    tty: true
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: -1
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      XAUTHORITY: /tmp/.docker.xauth
      GZ_GPU: "1" # Hardware accelerated Gazebo

    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - type: bind
        source: ${OPEN_MANIPULATOR_XAUTH:-/dev/null}
        target: /tmp/.docker.xauth
        read_only: true
      - open_manipulator_bash_history:/root/.open_manipulator_history
      - ../:/root/ros2_ws/src/open_manipulator/

    privileged: true
    command: bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility, graphics]

volumes:
  open_manipulator_bash_history:
