controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4

    interface_name: position

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05
      joint1: {trajectory: 0.10, goal: 0.03}
      joint2: {trajectory: 0.10, goal: 0.03}
      joint3: {trajectory: 0.10, goal: 0.03}
      joint4: {trajectory: 0.10, goal: 0.03}

gripper_controller:
  ros__parameters:
    joint: gripper_left_joint
